[package]
name = "holdout"
version = "0.1.0"
description = "Holdout — push-up commitment cohorts on Solana devnet"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "holdout"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Test leagues with a non-default day_length: LiteSVM, the local validator and
# the devnet program, which carries the short test lobby (FR-044a, T092); never
# a mainnet build (research R11).
test-leagues = []

[dependencies]
# Exact pins, not caret ranges: the program, its IDL and the Anchor CLI in
# `Anchor.toml` must be the same release, or a clean checkout builds against a
# different Anchor than the one that deploys it. Bumping these means bumping the
# CLI, the lockfile and quickstart §1 together.
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.1.2", features = ["token", "token_2022"] }
# The `TokenGroupMember` extension the Seeker Genesis Token check reads
# (research R17). The version anchor-spl itself resolves, already in the lockfile.
spl-token-group-interface = "=0.7.2"

[dev-dependencies]
# Packs crafted token accounts in the genesis check's unit tests.
solana-program-pack = "=3.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Anchor's `#[program]` expansion emits `cfg`s the crate itself never declares —
# `target_os = "solana"` for the on-chain target and three features the runtime
# sets. Declaring them here keeps `clippy -D warnings` (CI) honest: an *actual*
# stale `cfg` still fails, these four no longer do.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_os, values("solana"))',
  'cfg(feature, values("anchor-debug"))',
  'cfg(feature, values("custom-heap"))',
  'cfg(feature, values("custom-panic"))',
] }
