<!-- @dsCard group="Containers" height=420 subtitle="A question before leaving" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dialog — preview</title></head>
<body>
<div class="ho-scrim" style="min-height:400px">
  <div class="ho-dialog" role="dialog" aria-labelledby="t">
    <p class="ho-dialog-title" id="t">What did you just do?</p>
    <p class="ho-body" style="text-align:center;font-size:14px;line-height:20px">The app counted 17. Log what you really did — it goes into this set's trace.</p>
    <div class="ho-card-row"><span class="ho-body" style="color:var(--text-primary)">Full push-ups</span><span class="ho-stepper"><button class="ho-stepper-btn" aria-label="Fewer">−</button><span class="ho-amount ho-stepper-value">15</span><button class="ho-stepper-btn" aria-label="More">+</button></span></div>
    <div class="ho-card-row"><span class="ho-body" style="color:var(--text-primary)">From the knees</span><span class="ho-stepper"><button class="ho-stepper-btn" aria-label="Fewer">−</button><span class="ho-amount ho-stepper-value">2</span><button class="ho-stepper-btn" aria-label="More">+</button></span></div>
    <div class="ho-dialog-actions">
      <button class="ho-quiet" style="color:var(--text-secondary)">Skip</button>
      <button class="ho-btn ho-btn-primary">Save</button>
    </div>
  </div>
</div>
</body>
</html>
