<!-- @dsCard group="Inputs" height=140 subtitle="Holdout Lab only: labelled in both states" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Switch — preview</title></head>
<body>
<div class="ho-stage" id="switch-demo" style="max-width:420px">
  <button class="ho-switch" role="switch" aria-checked="true" data-on="Test · recording sets as video — only people who agreed in writing to be filmed" data-off="Test · video off — only people who agreed in writing to be filmed"><span class="ho-switch-track"><span class="ho-switch-knob"></span></span><span class="ho-switch-text">Test · recording sets as video — only people who agreed in writing to be filmed</span></button>
  <button class="ho-switch" role="switch" aria-checked="false" data-on="Test · clean screen: no dots or text, for training recordings" data-off="Test · clean screen off"><span class="ho-switch-track"><span class="ho-switch-knob"></span></span><span class="ho-switch-text">Test · clean screen off</span></button>
</div>
<script>
// The label is read, not inferred: it changes with the state. Scoped to this card, so the gallery's other cards are untouched.
Array.prototype.forEach.call(document.querySelectorAll('#switch-demo .ho-switch'), function (s) {
  s.addEventListener('click', function () {
    var on = s.getAttribute('aria-checked') !== 'true';
    s.setAttribute('aria-checked', on ? 'true' : 'false');
    s.querySelector('.ho-switch-text').textContent = s.getAttribute(on ? 'data-on' : 'data-off');
  });
});
</script>
</body>
</html>
