# Continuous integration for Holdout.
#
# Three gates, in the order the quickstart runs them (§3):
#
#   program         rustfmt, clippy, the Rust unit suites and the no-oracle check —
#                   host toolchain only, so it answers in a few minutes.
#   anchor          the real SBF build. Publishes `holdout.so` and the IDL so the
#                   contract tests run against the same binary the judges would.
#   contract-tests  Kit + LiteSVM against that binary, plus the drift checks that
#                   keep the committed IDL, Codama client and fixtures honest.
#   kotlin          ktlint across all four modules, the JVM unit suites, and the
#                   debug APK. Independent of the three above: the app and the
#                   crank are built from the same sources but not from the .so.
#
# Versions are pinned to `Anchor.toml` and quickstart §1. Bumping one means bumping
# them together — a clean checkout must build against the Anchor that deploys it.
#
# The same four jobs run on a developer's machine with `bash scripts/ci-local.sh`
# (Solana side in WSL, Kotlin on Windows), which is the gate when this workflow's
# minutes run out. A change that touches only documentation — docs, specs, the
# agent and Spec Kit folders, Markdown — skips the four jobs: the `changes` job
# asks `scripts/needs-ci.sh`, which also lists the few such files a job does
# read (the README's weaknesses table and its source, and the program
# instructions contract the no-oracle suite checks). The `ci` gate reports
# either way, so a required check never waits on a run that did not start —
# which a workflow-level `paths` filter would leave pending.

name: CI

on:
  push:
    branches: [main, '001-holdout-hackathon']
  pull_request:
  workflow_dispatch:

# A new push supersedes the run in flight on the same ref; a finished run on main
# is never cancelled out from under a merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SOLANA_VERSION: 3.1.10
  ANCHOR_VERSION: 1.1.2
  NODE_VERSION: '22'
  # Anchor and Surfpool are run with telemetry off everywhere else in this
  # repository (quickstart §1); CI is no exception.
  NO_DNA: '1'

jobs:
  # ---------------------------------------------------------------- changes
  # Whether the change reaches anything a job reads. The diff is the PR's own
  # changes against its base, or the push's against the commit before it; a
  # manual run, or a push with nothing to compare against, runs everything.
  changes:
    name: Code or documentation alone
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ask scripts/needs-ci.sh
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) from="$PR_BASE"; range="$PR_BASE...HEAD" ;;
            push) from="$BEFORE"; range="$BEFORE..HEAD" ;;
            *) from="" ;;
          esac
          if [ -n "$from" ] && git rev-parse -q --verify "$from^{commit}" >/dev/null; then
            code="$(git diff --name-only "$range" | bash scripts/needs-ci.sh)"
          else
            code=true
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- program
  program:
    name: Program — fmt, clippy, unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: program

      - name: rustfmt
        run: cargo fmt --all -- --check

      # Constitution III: the contract never reads a price and never holds a fiat
      # figure. The script greps the program source with comments stripped (T017a).
      - name: No price, no oracle, no fiat figure
        run: bash scripts/check-no-oracle.sh

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `test-leagues` is what the LiteSVM suites build with; it must lint clean too.
      - name: clippy (test-leagues)
        run: cargo clippy --workspace --all-targets --features test-leagues -- -D warnings

      # The settlement vectors, the schedule maths and the account layouts that
      # `tests/helpers/layout-vectors.json` pins the TypeScript codecs to.
      - name: cargo test
        run: cargo test -p holdout --lib --features test-leagues

  # ----------------------------------------------------------------- anchor
  anchor:
    name: Anchor build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Solana and Anchor toolchains
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/avm
            ~/.cargo/bin/anchor
            ~/.avm
            ~/.local/share/solana
            ~/.cache/solana
          key: toolchain-${{ runner.os }}-solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}

      # What building anchor-cli from source needs on a bare runner; skipped
      # entirely when the toolchain comes back from the cache.
      - name: Install the build prerequisites
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential pkg-config libssl-dev libudev-dev llvm libclang-dev protobuf-compiler

      - name: Install the Solana CLI
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL "https://release.anza.xyz/v${SOLANA_VERSION}/install" | sh -s

      - name: Put the Solana CLI on PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor via avm
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/solana-foundation/anchor \
            --tag "v${ANCHOR_VERSION}" avm --locked --force
          avm install "${ANCHOR_VERSION}"
          avm use "${ANCHOR_VERSION}"

      - name: Report the toolchain
        run: |
          solana --version
          anchor --version
          cargo --version

      - name: Cache the SBF build
        uses: Swatinem/rust-cache@v2
        with:
          key: anchor
          cache-directories: target/sbf-solana-solana

      - name: anchor build
        run: anchor build

      # The test-league cases need a second binary, carrying the feature the
      # mainnet build never does (research R11, FR-044a). `league-setup.spec.ts` skips
      # them when it is missing, and a gate that skips in silence is worse than
      # one that fails. The command lives in tests/package.json, so the workflow
      # and a developer's shell build it the same way.
      - name: Build the test-leagues binary
        run: npm --prefix tests run build:test-leagues

      # The IDL is the build's output and the Codama client is generated from it
      # (quickstart §3). A stale committed copy means the client in the repository
      # describes a contract that no longer exists — fail here, on the diff, rather
      # than three jobs later on a puzzling decode error.
      - name: Refresh the IDL
        run: |
          mkdir -p idl
          cp target/idl/holdout.json idl/holdout.json

      - name: The committed IDL matches the build
        run: git diff --exit-code -- idl/

      # Everything the contract tests reach for under `target/`: the judged
      # binary, the test-leagues one, and the build's IDL — which
      # `no-oracle.spec.ts` reads at `target/idl/holdout.json`, not from the
      # committed copy. The committed copy rides along for the codegen step.
      - name: Publish the program and the IDL
        uses: actions/upload-artifact@v4
        with:
          name: program
          path: |
            target/deploy/holdout.so
            target/test-leagues/holdout.so
            target/idl/holdout.json
            idl/holdout.json
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------- contract tests
  contract-tests:
    name: Contract tests — Kit + LiteSVM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, anchor]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      # The same binary `anchor build` produced, at the path the harness expects
      # (`tests/helpers/harness.ts`: target/deploy/holdout.so).
      - name: Fetch the program and the IDL
        uses: actions/download-artifact@v4
        with:
          name: program

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        working-directory: tests
        run: npm ci

      - name: Regenerate the Codama client
        working-directory: tests
        run: npm run codegen

      - name: The committed client matches the IDL
        run: git diff --exit-code -- tests/clients/

      - name: Type-check
        working-directory: tests
        run: npx tsc --noEmit

      # Constitution VII writes the suites before the logic, so a red test is
      # the normal state of work not yet done. The gate ratchets instead of
      # choosing between a permanently red build and a blind one: every passing
      # test is gated, and the ones red on purpose are listed in
      # `tests/known-red.json`. A new failure fails the build; a listed test that
      # starts passing fails it too, until `--update` takes it off the list and it
      # joins the gated set. The list shrinks to nothing as T027 onward land.
      - name: vitest — the gate
        working-directory: tests
        run: npm run ci:gate

      # The suites regenerate the golden JSON the Rust, TypeScript and Kotlin
      # sides all read; a diff here means the three have drifted apart.
      - name: Fixtures unchanged
        run: git diff --exit-code -- fixtures/

  # ----------------------------------------------------------------- kotlin
  kotlin:
    name: Kotlin — ktlint, JVM tests, debug APK
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # JDK 21 runs the Gradle daemon; the app's bytecode targets Java 17
      # (quickstart §1).
      - name: Install the JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also asks for `tools`, which cmdline-tools 16 no longer
          # ships, and the step fails. AGP fetches the platform and build-tools
          # the app needs itself once the licences are accepted.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # One style across the app, the shared client, the rep counter and the
      # crank (T008). `./gradlew ktlintFormat` fixes what this reports.
      - name: ktlint
        working-directory: kotlin
        run: ./gradlew --no-daemon ktlintCheck

      # `core` is the one client the app and the crank share (R12), so its suite
      # is what keeps the two from drifting. The S1 spike's devnet round trip is
      # opt-in and stays off here — CI does not depend on a public RPC.
      - name: JVM unit tests
        working-directory: kotlin
        run: ./gradlew --no-daemon :core:test :repcounter:test :crank:test :app:testMemberDebugUnitTest :app:testLabDebugUnitTest

      # The crank loop's poll deadline, with a stub `java` (PR #65).
      - name: crank-loop.sh deadline
        run: bash scripts/test-crank-loop.sh

      # Assembling also runs `checkNoAudioPermission` on the merged manifest (FR-022a),
      # and the member app's check that it carries no Holdout Lab code (spec 004).
      - name: Debug APKs, the member app and Holdout Lab
        working-directory: kotlin
        run: ./gradlew --no-daemon :app:assembleMemberDebug :app:assembleLabDebug

      # Constitution XI and XIII: the README's weaknesses table is rendered from
      # `docs/weaknesses.json`, and the app's copy carries no gambling words.
      - name: Weaknesses table matches its source
        run: node scripts/render-weaknesses.mjs --check

      - name: The app's wording
        run: bash scripts/check-wording.sh

  # ------------------------------------------------------------------- gate
  # One required check for branch protection: green only when no job above
  # failed or was cancelled. A documentation-only change skips the four jobs and
  # is green here; `changes` failing is a failure like any other.
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, program, anchor, contract-tests, kotlin]
    if: always()
    steps:
      - name: Check the results
        run: |
          echo "changes:        ${{ needs.changes.result }} (code: ${{ needs.changes.outputs.code }})"
          echo "program:        ${{ needs.program.result }}"
          echo "anchor:         ${{ needs.anchor.result }}"
          echo "contract-tests: ${{ needs.contract-tests.result }}"
          echo "kotlin:         ${{ needs.kotlin.result }}"
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
