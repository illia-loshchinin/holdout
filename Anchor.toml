[toolchain]
anchor_version = "1.1.2"
solana_version = "3.1.10"

[features]
resolution = true
skip-lint = false

# Real program address; its keypair is kept outside the repository at
# `~/.config/solana/holdout-program-keypair.json` (quickstart §6).
[programs.devnet]
holdout = "Ho1d924DTXrCgVfbW1U2NkAc3rGk1F723weN8rduyoy4"

[programs.localnet]
holdout = "Ho1d924DTXrCgVfbW1U2NkAc3rGk1F723weN8rduyoy4"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

# Smoke suite only (quickstart §6). The real integration suite is Kit + LiteSVM,
# run with `npm --prefix tests test` — research R2.
[scripts]
test = "npx vitest run --dir tests/smoke"

[test]
startup_wait = 20000

[test.validator]
url = "https://api.devnet.solana.com"
